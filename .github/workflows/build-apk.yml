name: Build APK

on:
  create:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: ⚙️ Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/
          sudo ln -sf /opt/gradle-8.10.2/bin/gradle /usr/local/bin/gradle

      - name: 🔨 Build Debug APK
        working-directory: ./android
        run: gradle :app:assembleDebug --no-daemon

      - name: 🏷️ Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-cards-${{ steps.version.outputs.version }}-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: World Cup Cards ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: android/app/build/outputs/apk/debug/*.apk
          body: |
            # ⚽ World Cup Cards ${{ steps.version.outputs.tag }}

            APK Debug listo para instalar.

            ## 🔧 Configuración
            Settings → Servidor: `http://18.213.174.229:8080`
          generate_release_notes: false
