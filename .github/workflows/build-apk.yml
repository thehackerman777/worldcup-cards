name: Build APK

# ── Solo se activa al crear tags con formato vX.Y.Z ────
on:
  create:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon

      - name: 🔨 Build Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: 📤 Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-cards-v${{ github.ref_name }}-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 📤 Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-cards-v${{ github.ref_name }}-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: 🏷️ Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: World Cup Cards ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          body: |
            # ⚽ World Cup Cards ${{ steps.version.outputs.tag }}

            ## 📦 Artefactos
            - `worldcup-cards-${{ steps.version.outputs.version }}-debug.apk` — APK de depuración
            - `worldcup-cards-${{ steps.version.outputs.version }}-release.apk` — APK de producción

            ## ✅ Cambios
            _Generado desde el tag ${{ steps.version.outputs.tag }}_
          generate_release_notes: false
