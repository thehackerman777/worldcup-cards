name: Build APK

on:
  create:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 🔨 Build Debug APK
        working-directory: ./android
        run: gradle :app:assembleDebug --no-daemon

      - name: 🔨 Build Release APK
        working-directory: ./android
        run: gradle :app:assembleRelease --no-daemon

      - name: 🏷️ Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-cards-${{ steps.version.outputs.version }}-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-cards-${{ steps.version.outputs.version }}-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: World Cup Cards ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          body: |
            # ⚽ World Cup Cards ${{ steps.version.outputs.tag }}

            ## 📦 Artefactos
            - `worldcup-cards-${{ steps.version.outputs.version }}-debug.apk` — APK Debug
            - `worldcup-cards-${{ steps.version.outputs.version }}-release.apk` — APK Release

            ## 🚀 Instalación
            1. Descarga el APK deseado
            2. Activa "Instalar apps desconocidas" en Android
            3. Abre el archivo APK

            ## 🔧 Configuración del servidor
            Abre la app → Settings → Configura la IP/URL del backend: `http://18.213.174.229:8080`
          generate_release_notes: false
