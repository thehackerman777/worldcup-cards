name: Build APK

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  # Solo generar APKs en tags sobre main
  create:
    tags:
      - 'v*'

jobs:
  # ── Validation (siempre en push/pr) ─────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Solo en push/PR, no en tags
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Backend compiles
        run: |
          cd backend
          ./gradlew compileKotlin --no-daemon

      - name: Validate Android compiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            cd android
            ./gradlew assembleDebug --no-daemon

  # ── Build APK Debug (solo en tags) ──────────────────────
  build-debug:
    name: Build APK Debug
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-cards-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # ── Build APK Release (solo en tags) ────────────────────
  build-release:
    name: Build APK Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-cards-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
