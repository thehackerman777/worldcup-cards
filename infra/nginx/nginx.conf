# ═══════════════════════════════════════════════════════════
# Nginx - World Cup Cards Reverse Proxy
# ═══════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # SSL configuration (when certificate is available)
    # server {
    #     listen 443 ssl http2;
    #     server_name api.worldcup-cards.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     location / {
    #         proxy_pass http://backend:8080;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    # HTTP server (development / initial setup)
    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS (enable when SSL is configured)
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Expose-Headers "Authorization" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Health check
        location /health {
            proxy_pass http://backend:8080/api/v1/health;
        }
    }
}
