# ═══════════════════════════════════════════════════════════
# Docker Compose - World Cup Cards Full Stack
# ═══════════════════════════════════════════════════════════
# Uso:
#   docker compose up -d              # Iniciar todo
#   docker compose up -d db           # Solo BD (para dev local)
#   docker compose down               # Detener todo
# ═══════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: wcapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-worldcup_cards}
      POSTGRES_USER: ${DB_USER:-wcapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wcapp_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - wcapp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcapp -d worldcup_cards"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wcapp-network

  # ── Backend (Spring Boot) ───────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wcapp-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-worldcup_cards}
      DB_USER: ${DB_USER:-wcapp}
      DB_PASSWORD: ${DB_PASSWORD:-wcapp_dev_password}
      JWT_SECRET: ${JWT_SECRET:-ChangeThisSecretInProduction2026VeryLong}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wcapp-network

  # ── Nginx (Reverse Proxy) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: wcapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/sites-enabled:ro
      - wcapp_ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - wcapp-network

volumes:
  wcapp_pg_data:
  wcapp_ssl:

networks:
  wcapp-network:
    driver: bridge
