server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: worldcup-cards-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:worldcup_cards}
    username: ${DB_USER:wcapp}
    password: ${DB_PASSWORD:wcapp_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:DefaultJWTSecretKeyForDevelopmentOnlyChangeInProduction2024}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

logging:
  level:
    root: INFO
    com.wcapp: DEBUG
    org.springframework.security: INFO
---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.wcapp: DEBUG
    org.hibernate.SQL: DEBUG

spring.jpa.show-sql: true
---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.wcapp: INFO

spring.jpa.show-sql: false
